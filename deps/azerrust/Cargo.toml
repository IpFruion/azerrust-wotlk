[package]
name = "azerrust"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
cxx = "1.0"
enum_dispatch = "0.3"
bitflags = "2.13.1"

[build-dependencies]
cxx-build = "1.0"
glob = "0.3.4"
rayon = "1.12.0"

[lib]
crate-type = ["staticlib"]

[profile.release]
lto = true
